<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acceso protegido | Consulta de Horas</title>

  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="referrer" content="no-referrer" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
  <script src="/assets/gate.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Consulta de Horas</h1>
        <p class="sub">Consulta de horas del personal.</p>
      </div>
      <div class="pill" id="pill">
        <span class="dot" id="dot"></span>
        <span id="pillText">Verificación requerida</span>
      </div>
    </header>

    <main class="card gate" aria-labelledby="gateTitle">
      <div>
        <h2 id="gateTitle">Verificá que sos una persona</h2>
        <p class="gateText">Completá la verificación para ingresar a la consulta.</p>
      </div>

      <div class="cf-turnstile"
        data-sitekey="0x4AAAAAACOdjCkqEJcraLa1"
        data-theme="light"
        data-action="turnstile-spin-v1"
        data-callback="onTurnstileOk"
        data-expired-callback="onTurnstileExpired"
        data-error-callback="onTurnstileError">
      </div>

      <p class="gateMessage" id="gateMessage" role="status" aria-live="polite">
        Completá el CAPTCHA para continuar.
      </p>

      <footer class="footerLine">
        <span>Ante dudas o inquietudes, comunicate con la oficina de Recursos Humanos.</span>
        <a id="waLink" class="wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </footer>
    </main>
  </div>
</body>
</html>
