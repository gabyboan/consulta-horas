<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Consulta de Horas</title>

  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <meta name="referrer" content="no-referrer" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Consulta de Horas</h1>
        <p class="sub">Consulta de horas del personal.</p>
      </div>
      <div class="pill" id="pill">
        <span class="dot" id="dot"></span>
        <span id="pillText">Verificando acceso</span>
      </div>
    </header>

    <p id="accessMessage" role="status" aria-live="polite">Verificando el acceso antes de solicitar el DNI…</p>
    <noscript><p>Activá JavaScript y <a href="/">completá el CAPTCHA</a> para continuar.</p></noscript>
    <div class="card" id="consultaPanel" hidden>
      <form class="form" id="frm" novalidate>
        <div>
          <label for="dni">DNI</label>
          <input id="dni" name="dni" inputmode="numeric" autocomplete="off"
                 placeholder="Ej: 12345678" maxlength="10" />
        </div>

        <button id="btn" type="submit">Consultar</button>
      </form>


      <div id="out">
        <div class="resultHead">
          <div>
            <p class="name" id="nombre"></p>
            <p class="dni" id="dniOut"></p>
          </div>
          <div class="status" id="status"></div>
        </div>

        <div class="grid">
          <div class="hourCard" id="particularesCard">
            <div class="k">HORAS PARTICULARES</div>
            <div class="v" id="particulares"></div>
          </div>

          <div class="hourCard" id="enfermedadCard">
            <div class="k">HORAS POR ENFERMEDAD</div>
            <div class="v" id="enfermedad"></div>
          </div>


          <div class="hourCard" id="francosCard" hidden>
            <div class="k">HORAS DE FRANCOS</div>
            <div class="v" id="francos"></div>
          </div>

          <div class="hourCard" id="imprevistosCard" hidden>
            <div class="k">IMPREVISTOS DISPONIBLES</div>
            <div class="v" id="imprevistos"></div>
          </div>
        </div>
      </div>

      <footer class="footerLine">
        <span>Ante dudas o inquietudes, comunicate con la oficina de Recursos Humanos.</span>
        <a id="waLink" class="wa" href="#" target="_blank" rel="noopener noreferrer">
          WhatsApp
        </a>
      </footer>
    </div>
  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
